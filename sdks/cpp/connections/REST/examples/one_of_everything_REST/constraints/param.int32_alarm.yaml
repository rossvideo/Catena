# INT_ALARM constraint example [NOT YET IMPLEMENTED]
type: INT32
value: { int32_value: 0 }
constraint:
  type: ALARM_TABLE
  alarm_table:
    alarms:
      - bit_value: 0
        severity: 6 # Info
        description: { display_strings: { 
          en: "Info", 
          fr: "Information", 
          es: "Información", 
          ja: "情報" } }
      - bit_value: 1
        severity: 4 # Warning
        description: { display_strings: { 
          en: "Warning", 
          fr: "Avertissement", 
          es: "Advertencia", 
          ja: "警告" } }
      - bit_value: 2
        severity: 2 # Critical
        description: { display_strings: { 
          en: "Critical", 
          fr: "Grave", 
          es: "Grave", 
          ja: "重大" } }
      - bit_value: 3
        severity: 3 # Error
        description: { display_strings: { 
          en: "Error", 
          fr: "Erreur", 
          es: "Error", 
          ja: "エラー" } }
      - bit_value: 4
        severity: 0 # Emergency
        description: { display_strings: { 
          en: "Emergency", 
          fr: "Urgence", 
          es: "Emergencia", 
          ja: "緊急" } }