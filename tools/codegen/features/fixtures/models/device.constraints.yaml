slot: 1
multi_set_enabled: true
detail_level: FULL
access_scopes: ["st2138:mon", "st2138:op", "st2138:cfg", "st2138:adm"]
default_scope: st2138:op
constraints:
  sexagesimal:
    type: INT_RANGE
    int32_range:
      min_value: 0
      max_value: 59
      step: 1
params:
  product:
    import:
      url: ./param.product.yaml
  sexagesimal:
    type: INT32
    name: { display_strings: { en: Seconds } }
    value: { int32_value: 0 }
    widget: number
    constraint:
      ref_oid: sexagesimal
  power:
    type: INT32
    name: { display_strings: { en: Power } }
    value: { int32_value: 0 }
    widget: button
    constraint:
      type: INT_CHOICE
      int32_choice:
        choices:
          - name: { display_strings: { en: Off } }
            value: 0
          - name: { display_strings: { en: On } }
            value: 1
  odd_numbers:
    type: INT32_ARRAY
    name: { display_strings: { en: Odd Numbers } }
    value: { int32_array_values: { ints: [1, 3, 5, 7, 9] } }
    widget: number
    constraint:
      type: INT_RANGE
      int32_range:
        min_value: 1
        max_value: 9
        step: 2
  gain:
    type: FLOAT32
    name: { display_strings: { en: Gain } }
    value: { float32_value: 0.0 }
    widget: fader
    constraint:
      type: FLOAT_RANGE
      float_range:
        min_value: -2.0
        max_value: 2.0
        step: 0.25
  channel:
    type: STRING
    name: { display_strings: { en: Channel } }
    value: { string_value: "a" }
    constraint:
      type: STRING_CHOICE
      string_choice:
        choices: ["a", "b", "c"]
        strict: true
  state:
    type: STRING
    name: { display_strings: { en: State } }
    value: { string_value: "stopped" }
    constraint:
      type: STRING_STRING_CHOICE
      string_string_choice:
        choices:
          - value: stopped
            name: { display_strings: { en: Stopped } }
          - value: playing
            name: { display_strings: { en: Playing } }
        strict: true
